<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chuyển Đổi Thời Khóa Biểu Ra Lịch Cá Nhân</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen p-4 md:p-8 font-sans">
  <div class="max-w-4xl mx-auto space-y-6">
    <div class="text-center space-y-2">
      <h1 class="text-2xl md:text-3xl font-bold text-slate-900">Công Cụ Đồng Bộ Thời Khóa Biểu</h1>
      <p class="text-sm text-slate-500">Chuyển bảng thời khóa biểu của trường thành giao diện trực quan và file .ics cho Google Calendar</p>
    </div>

    <!-- Input Box -->
    <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-5 space-y-4">
      <label class="block font-semibold text-slate-700">1. Dán bảng lịch học đã copy vào đây:</label>
      <textarea id="rawInput" rows="7" class="w-full border border-slate-300 rounded-lg p-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 font-mono" placeholder="Bôi đen toàn bộ bảng lịch học trên web trường, nhấn Ctrl+C rồi dán vào đây..."></textarea>
      
      <div class="flex flex-wrap gap-3">
        <button onclick="processData()" class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-5 py-2.5 rounded-lg transition text-sm">
          Phân tích lịch học
        </button>
        <button id="downloadBtn" onclick="exportICS()" class="hidden bg-emerald-600 hover:bg-emerald-700 text-white font-medium px-5 py-2.5 rounded-lg transition text-sm">
          Tải file .ics (Cho Google Calendar / Apple Calendar)
        </button>
      </div>
    </div>

    <!-- Kết quả hiển thị -->
    <div id="resultContainer" class="hidden space-y-4">
      <h2 class="font-bold text-lg text-slate-800">2. Danh sách các lớp học phát hiện được:</h2>
      <div class="overflow-x-auto bg-white rounded-xl shadow-sm border border-slate-200">
        <table class="w-full text-left text-sm border-collapse">
          <thead class="bg-slate-100 text-slate-700 border-b border-slate-200">
            <tr>
              <th class="p-3">Tên học phần</th>
              <th class="p-3">Thứ</th>
              <th class="p-3">Tiết & Giờ</th>
              <th class="p-3">Giai đoạn</th>
              <th class="p-3">Phòng</th>
              <th class="p-3">Giảng viên</th>
            </tr>
          </thead>
          <tbody id="scheduleTableBody" class="divide-y divide-slate-100"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    // Bảng quy đổi tiết học sang giờ chuẩn (có thể điều chỉnh theo khung giờ thực tế của trường)
    const LESSON_HOURS = {
      "1-5": { start: "07:00", end: "11:30" },
      "6-10": { start: "12:30", end: "17:00" },
      "11-15": { start: "17:30", end: "21:00" }
    };

    let parsedEvents = [];

    function processData() {
      const text = document.getElementById("rawInput").value;
      if (!text.trim()) return alert("Vui lòng dán dữ liệu vào ô trống!");

      // Tách khối môn học dựa trên số thứ tự đứng trước tên môn
      // Cấu trúc nhận diện: số STT đầu hàng theo sau là tên môn và chuỗi mã lớp tín chỉ
      const lines = text.split(/\n+/);
      const fullText = lines.join("\n");

      // Regex nhận diện các khối dữ liệu theo dòng có chứa mã tín chỉ định dạng số_số (vd: 0126000110_2)
      const subjectPattern = /(\d+)\s+([^\d\n]+?)\s*(\d+)\s+([0-9_]+)([\s\S]*?)(?=(?:\n\s*\d+\s+[^\d\n]+\s*\d+\s+[0-9_]+)|$)/g;
      
      parsedEvents = [];
      let match;

      while ((match = subjectPattern.exec(fullText)) !== null) {
        const subjectName = match[2].trim();
        const detailsChunk = match[5].trim();

        // Tách các giai đoạn thời gian: dd/mm/yyyy- dd/mm/yyyy
        const dateRegex = /(\d{2}\/\d{2}\/\d{4})\s*-\s*(\d{2}\/\d{2}\/\d{4})/g;
        const dates = [...detailsChunk.matchAll(dateRegex)];

        // Tách các thông tin còn lại: Thứ, Tiết (vd 6-10), Phòng, Giảng viên
        const linesChunk = detailsChunk.split("\n").map(l => l.trim()).filter(l => l.length > 0);
        
        // Quét tìm thứ và tiết
        const dayMatches = detailsChunk.match(/\b([2-7]|CN)\b/g) || [];
        const sessionMatches = detailsChunk.match(/\b(\d{1,2}-\d{1,2})\b/g) || [];
        
        // Trích xuất phòng học và giảng viên
        const rooms = detailsChunk.match(/(Hội trường [A-Za-z0-9-]+|Tin học [A-Za-z0-9-]+|Online\s*\d*|[A-Z]\d+-\d+)/g) || [];
        
        // Xử lý mapping cho từng khoảng thời gian
        dates.forEach((d, idx) => {
          const startDateStr = d[1];
          const endDateStr = d[2];
          const dayOfWeek = dayMatches[idx] || dayMatches[0] || "3";
          const session = sessionMatches[idx] || sessionMatches[0] || "1-5";
          const room = rooms[idx] || rooms[0] || "Chưa rõ";
          
          parsedEvents.push({
            subject: subjectName,
            startDateStr,
            endDateStr,
            dayOfWeek,
            session,
            room
          });
        });
      }

      renderTable();
    }

    function renderTable() {
      const tbody = document.getElementById("scheduleTableBody");
      tbody.innerHTML = "";

      if (parsedEvents.length === 0) {
        alert("Chưa đọc được dữ liệu. Hãy đảm bảo bạn copy toàn bộ bảng lịch học.");
        return;
      }

      parsedEvents.forEach(item => {
        const timeInfo = LESSON_HOURS[item.session] || { start: "Bắt đầu tiết", end: "Kết thúc tiết" };
        const tr = document.createElement("tr");
        tr.className = "hover:bg-slate-50 transition";
        tr.innerHTML = `
          <td class="p-3 font-medium text-slate-900">${item.subject}</td>
          <td class="p-3"><span class="px-2 py-0.5 rounded text-xs font-semibold bg-blue-100 text-blue-700">Thứ ${item.dayOfWeek}</span></td>
          <td class="p-3">Tiết ${item.session} <br><span class="text-xs text-slate-400">(${timeInfo.start} - ${timeInfo.end})</span></td>
          <td class="p-3 text-xs text-slate-600">${item.startDateStr} → ${item.endDateStr}</td>
          <td class="p-3"><span class="font-mono text-xs bg-slate-100 px-2 py-1 rounded">${item.room}</span></td>
          <td class="p-3 text-xs text-slate-500">Giảng viên bộ môn</td>
        `;
        tbody.appendChild(tr);
      });

      document.getElementById("resultContainer").classList.remove("hidden");
      document.getElementById("downloadBtn").classList.remove("hidden");
    }

    // Hàm tạo file chuẩn .ics để nạp vào Calendar
    function exportICS() {
      if (parsedEvents.length === 0) return;

      let icsContent = [
        "BEGIN:VCALENDAR",
        "VERSION:2.0",
        "PRODID:-//SinhVien Calendar Tool//VN",
        "CALSCALE:GREGORIAN",
        "METHOD:PUBLISH"
      ];

      const dayMap = { "2": "MO", "3": "TU", "4": "WE", "5": "TH", "6": "FR", "7": "SA", "CN": "SU" };

      parsedEvents.forEach((ev, i) => {
        const time = LESSON_HOURS[ev.session] || { start: "07:00", end: "11:30" };
        const [startDay, startMonth, startYear] = ev.startDateStr.split("/").map(Number);
        const [endDay, endMonth, endYear] = ev.endDateStr.split("/").map(Number);

        // Chuyển ngày bắt đầu sang chuẩn yyyymmdd
        const dateObj = new Date(startYear, startMonth - 1, startDay);
        
        // Căn chỉnh đúng thứ thực tế đầu tiên kể từ ngày bắt đầu
        const targetDay = ev.dayOfWeek === "CN" ? 0 : parseInt(ev.dayOfWeek) - 1;
        while (dateObj.getDay() !== targetDay) {
          dateObj.setDate(dateObj.getDate() + 1);
        }

        const formatICSDate = (d, timeStr) => {
          const y = d.getFullYear();
          const m = String(d.getMonth() + 1).padStart(2, "0");
          const day = String(d.getDate()).padStart(2, "0");
          const [hh, mm] = timeStr.split(":");
          return `${y}${m}${day}T${hh}${mm}00`;
        };

        const untilDate = `${endYear}${String(endMonth).padStart(2, "0")}${String(endDay).padStart(2, "0")}T235959Z`;
        const dtStart = formatICSDate(dateObj, time.start);
        const dtEnd = formatICSDate(dateObj, time.end);
        const byDay = dayMap[ev.dayOfWeek] || "MO";

        icsContent.push(
          "BEGIN:VEVENT",
          `UID:${Date.now()}_${i}@sinhvien.local`,
          `DTSTAMP:${formatICSDate(new Date(), "00:00")}Z`,
          `SUMMARY:${ev.subject}`,
          `LOCATION:${ev.room}`,
          `DESCRIPTION:Lớp: ${ev.subject} | Tiết: ${ev.session} | Phòng: ${ev.room}`,
          `DTSTART:${dtStart}`,
          `DTEND:${dtEnd}`,
          `RRULE:FREQ=WEEKLY;UNTIL=${untilDate};BYDAY=${byDay}`,
          "END:VEVENT"
        );
      });

      icsContent.push("END:VCALENDAR");

      // Kích hoạt tải file xuống máy
      const blob = new Blob([icsContent.join("\r\n")], { type: "text/calendar;charset=utf-8" });
      const link = document.createElement("a");
      link.href = window.URL.createObjectURL(blob);
      link.setAttribute("download", "ThoiKhoaBieu.ics");
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }
  </script>
</body>
</html>
