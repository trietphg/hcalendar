<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HCalendar - Thời Khóa Biểu Sinh Viên</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .cell-min { min-height: 120px; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen p-3 md:p-6 font-sans">
  <div class="max-w-7xl mx-auto space-y-5">
    <!-- Tiêu đề -->
    <div class="text-center space-y-1">
      <h1 class="text-3xl font-extrabold text-blue-700 tracking-tight">HCalendar</h1>
      <p class="text-xs md:text-sm text-slate-500 font-medium">Xem thời khóa biểu theo từng tuần trực quan 📅</p>
    </div>

    <!-- Khối nhập liệu -->
    <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-4 space-y-3">
      <div class="flex items-center justify-between">
        <label class="font-semibold text-slate-700 text-sm">Dán lịch học (theo kỳ) vào đây:</label>
        <span class="text-xs text-slate-400">Ctrl + A rồi Ctrl + C từ trang thời khóa biểu trường</span>
      </div>
      <textarea id="rawInput" rows="4" class="w-full border border-slate-300 rounded-lg p-2.5 text-xs focus:outline-none focus:ring-2 focus:ring-blue-500 font-mono" placeholder="Dán bảng thời khóa biểu vào đây..."></textarea>
      
      <div class="flex flex-wrap items-center gap-3">
        <button onclick="processData()" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-4 py-2 rounded-lg transition text-xs md:text-sm shadow-sm">
          Phân tích & Tạo lịch
        </button>
        <button id="downloadBtn" onclick="exportICS()" class="hidden bg-emerald-600 hover:bg-emerald-700 text-white font-semibold px-4 py-2 rounded-lg transition text-xs md:text-sm shadow-sm">
          📥 Tải file .ics cho Google Calendar
        </button>
      </div>
    </div>

    <!-- Khung hiển thị Lịch theo tuần -->
    <div id="resultContainer" class="hidden bg-white rounded-xl shadow-sm border border-slate-200 p-4 md:p-6 space-y-4">
      <!-- Thanh công cụ chuyển tuần -->
      <div class="flex flex-wrap items-center justify-between gap-3 bg-slate-50 p-3 rounded-lg border border-slate-200">
        <div class="flex items-center gap-2">
          <button onclick="prevWeek()" class="px-3 py-1.5 bg-white border border-slate-300 hover:bg-slate-100 rounded text-xs font-semibold shadow-sm transition">
            ◀ Tuần trước
          </button>
          <button onclick="currentWeek()" class="px-3 py-1.5 bg-blue-50 border border-blue-200 text-blue-700 hover:bg-blue-100 rounded text-xs font-semibold shadow-sm transition">
            Tuần đầu kỳ
          </button>
          <button onclick="nextWeek()" class="px-3 py-1.5 bg-white border border-slate-300 hover:bg-slate-100 rounded text-xs font-semibold shadow-sm transition">
            Tuần sau ▶
          </button>
        </div>

        <div id="currentWeekRange" class="text-sm font-bold text-slate-800 text-center"></div>

        <!-- Chú thích màu sắc -->
        <div class="flex items-center gap-3 text-xs font-medium text-slate-600">
          <span class="flex items-center gap-1.5"><span class="w-3 h-3 rounded bg-emerald-100 border border-emerald-400 inline-block"></span> Thực hành</span>
          <span class="flex items-center gap-1.5"><span class="w-3 h-3 rounded bg-sky-100 border border-sky-400 inline-block"></span> Online</span>
          <span class="flex items-center gap-1.5"><span class="w-3 h-3 rounded bg-slate-100 border border-slate-300 inline-block"></span> Lý thuyết</span>
        </div>
      </div>

      <!-- Bảng Ma Trận Grid -->
      <div class="overflow-x-auto">
        <table class="w-full border-collapse border border-slate-200 text-xs md:text-sm min-w-[900px]">
          <thead>
            <tr class="bg-slate-50 text-blue-900 border-b border-slate-200 font-bold text-center">
              <th class="p-2.5 border border-slate-200 w-24 bg-slate-100">Ca học</th>
              <th id="th-2" class="p-2.5 border border-slate-200">Thứ 2</th>
              <th id="th-3" class="p-2.5 border border-slate-200">Thứ 3</th>
              <th id="th-4" class="p-2.5 border border-slate-200">Thứ 4</th>
              <th id="th-5" class="p-2.5 border border-slate-200">Thứ 5</th>
              <th id="th-6" class="p-2.5 border border-slate-200">Thứ 6</th>
              <th id="th-7" class="p-2.5 border border-slate-200">Thứ 7</th>
              <th id="th-CN" class="p-2.5 border border-slate-200">Chủ nhật</th>
            </tr>
          </thead>
          <tbody>
            <!-- Sáng -->
            <tr>
              <td class="p-2 border border-slate-200 text-center font-bold bg-amber-50/70 text-amber-900">
                Sáng<br><span class="text-[10px] font-normal text-slate-500">Tiết 1 - 5</span>
              </td>
              <td id="cell-2-sang" class="p-1.5 border border-slate-200 align-top cell-min space-y-1.5"></td>
              <td id="cell-3-sang" class="p-1.5 border border-slate-200 align-top cell-min space-y-1.5"></td>
              <td id="cell-4-sang" class="p-1.5 border border-slate-200 align-top cell-min space-y-1.5"></td>
              <td id="cell-5-sang" class="p-1.5 border border-slate-200 align-top cell-min space-y-1.5"></td>
              <td id="cell-6-sang" class="p-1.5 border border-slate-200 align-top cell-min space-y-1.5"></td>
              <td id="cell-7-sang" class="p-1.5 border border-slate-200 align-top cell-min space-y-1.5"></td>
              <td id="cell-CN-sang" class="p-1.5 border border-slate-200 align-top cell-min space-y-1.5"></td>
            </tr>
            <!-- Chiều -->
            <tr>
              <td class="p-2 border border-slate-200 text-center font-bold bg-amber-50/70 text-amber-900">
                Chiều<br><span class="text-[10px] font-normal text-slate-500">Tiết 6 - 10</span>
              </td>
              <td id="cell-2-chieu" class="p-1.5 border border-slate-200 align-top cell-min space-y-1.5"></td>
              <td id="cell-3-chieu" class="p-1.5 border border-slate-200 align-top cell-min space-y-1.5"></td>
              <td id="cell-4-chieu" class="p-1.5 border border-slate-200 align-top cell-min space-y-1.5"></td>
              <td id="cell-5-chieu" class="p-1.5 border border-slate-200 align-top cell-min space-y-1.5"></td>
              <td id="cell-6-chieu" class="p-1.5 border border-slate-200 align-top cell-min space-y-1.5"></td>
              <td id="cell-7-chieu" class="p-1.5 border border-slate-200 align-top cell-min space-y-1.5"></td>
              <td id="cell-CN-chieu" class="p-1.5 border border-slate-200 align-top cell-min space-y-1.5"></td>
            </tr>
            <!-- Tối -->
            <tr>
              <td class="p-2 border border-slate-200 text-center font-bold bg-amber-50/70 text-amber-900">
                Tối<br><span class="text-[10px] font-normal text-slate-500">Tiết 11 - 15</span>
              </td>
              <td id="cell-2-toi" class="p-1.5 border border-slate-200 align-top cell-min space-y-1.5"></td>
              <td id="cell-3-toi" class="p-1.5 border border-slate-200 align-top cell-min space-y-1.5"></td>
              <td id="cell-4-toi" class="p-1.5 border border-slate-200 align-top cell-min space-y-1.5"></td>
              <td id="cell-5-toi" class="p-1.5 border border-slate-200 align-top cell-min space-y-1.5"></td>
              <td id="cell-6-toi" class="p-1.5 border border-slate-200 align-top cell-min space-y-1.5"></td>
              <td id="cell-7-toi" class="p-1.5 border border-slate-200 align-top cell-min space-y-1.5"></td>
              <td id="cell-CN-toi" class="p-1.5 border border-slate-200 align-top cell-min space-y-1.5"></td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const LESSON_HOURS = {
      "1-5": { start: "07:00", end: "11:30" },
      "6-10": { start: "12:30", end: "17:00" },
      "11-15": { start: "17:30", end: "21:00" }
    };

    let allCourses = [];
    let currentMonday = null;
    let semesterStartMonday = null;

    function parseDMY(str) {
      const [d, m, y] = str.split("/").map(Number);
      return new Date(y, m - 1, d);
    }

    function formatDateVN(date) {
      const d = String(date.getDate()).padStart(2, "0");
      const m = String(date.getMonth() + 1).padStart(2, "0");
      return `${d}/${m}`;
    }

    function getMonday(d) {
      const date = new Date(d);
      const day = date.getDay();
      const diff = date.getDate() - day + (day === 0 ? -6 : 1);
      const mon = new Date(date.setDate(diff));
      mon.setHours(0, 0, 0, 0);
      return mon;
    }

    function processData() {
      const text = document.getElementById("rawInput").value;
      if (!text.trim()) return alert("Vui lòng dán dữ liệu lịch học!");

      allCourses = [];
      const blockPattern = /(\d+)\s+([^\d\n]+?)\s*(\d+)\s+([0-9_]+)([\s\S]*?)(?=(?:\n\s*\d+\s+[^\d\n]+\s*\d+\s+[0-9_]+)|$)/g;
      let match;

      while ((match = blockPattern.exec(text)) !== null) {
        const subjectName = match[2].trim();
        const classCode = match[4].trim();
        const detailsChunk = match[5].trim();

        const dateRegex = /(\d{2}\/\d{2}\/\d{4})\s*-\s*(\d{2}\/\d{2}\/\d{4})/g;
        const dates = [...detailsChunk.matchAll(dateRegex)];
        const dayMatches = detailsChunk.match(/\b([2-7]|CN)\b/g) || [];
        const sessionMatches = detailsChunk.match(/\b(\d{1,2}\s*-\s*\d{1,2})\b/g) || [];
        const rooms = detailsChunk.match(/(Hội trường\s*[^\n\r]+|Tin học\s*[^\n\r]+|Online\s*\d*|[A-Z]\d+-\d+)/gi) || [];
        const teachers = detailsChunk.match(/(?:Đinh Thị Trang|Nguyễn Thị Lan Đan|Phạm Thúy Hằng|Nguyễn Thị Kim Tuyền|Phan Trần Điền|Trịnh Duy Biên|[A-ZÀ-Ỹ][a-zà-ỹ]+(?:\s+[A-ZÀ-Ỹ][a-zà-ỹ]+){1,3})/g) || [];

        const count = dates.length || 1;
        for (let i = 0; i < count; i++) {
          const d = dates[i];
          allCourses.push({
            subject: subjectName,
            classCode: classCode,
            startDate: d ? parseDMY(d[1]) : new Date(2026, 7, 31),
            endDate: d ? parseDMY(d[2]) : new Date(2027, 0, 15),
            dayOfWeek: dayMatches[i] || dayMatches[0] || "2",
            session: (sessionMatches[i] || sessionMatches[0] || "1-5").replace(/\s+/g, ""),
            room: rooms[i] ? rooms[i].trim() : (rooms[0] || "Chưa rõ"),
            teacher: teachers[i] ? teachers[i].trim() : (teachers[0] || "Giảng viên bộ môn")
          });
        }
      }

      if (allCourses.length === 0) {
        return alert("Chưa nhận diện được lịch học. Hãy chắc chắn bạn đã bôi đen và copy cả bảng!");
      }

      // Tìm ngày Thứ 2 nhỏ nhất làm mốc đầu kỳ
      let minDate = allCourses[0].startDate;
      allCourses.forEach(c => {
        if (c.startDate < minDate) minDate = c.startDate;
      });

      semesterStartMonday = getMonday(minDate);
      currentMonday = new Date(semesterStartMonday);

      document.getElementById("resultContainer").classList.remove("hidden");
      document.getElementById("downloadBtn").classList.remove("hidden");

      renderWeek();
    }

    function renderWeek() {
      // Tính ngày Chủ nhật của tuần đang chọn
      const sunday = new Date(currentMonday);
      sunday.setDate(currentMonday.getDate() + 6);
      sunday.setHours(23, 59, 59, 999);

      // Cập nhật tiêu đề khoảng ngày của tuần
      document.getElementById("currentWeekRange").innerText = 
        `Tuần: ${formatDateVN(currentMonday)} - ${formatDateVN(sunday)}/${sunday.getFullYear()}`;

      // Cập nhật ngày vào tiêu đề từng cột
      const days = ["2", "3", "4", "5", "6", "7", "CN"];
      days.forEach((d, idx) => {
        const dObj = new Date(currentMonday);
        dObj.setDate(currentMonday.getDate() + idx);
        const th = document.getElementById(`th-${d}`);
        th.innerHTML = `${d === "CN" ? "Chủ nhật" : "Thứ " + d}<br><span class="text-[11px] font-normal text-slate-500">${formatDateVN(dObj)}</span>`;
      });

      // Dọn sạch các ô trước khi render
      const shifts = ["sang", "chieu", "toi"];
      days.forEach(d => {
        shifts.forEach(s => {
          const el = document.getElementById(`cell-${d}-${s}`);
          if (el) el.innerHTML = "";
        });
      });

      // Lọc các môn diễn ra trong tuần này
      const activeCourses = allCourses.filter(c => {
        // Tuần hiện tại nằm trong khoảng [startDate, endDate] của môn
        return currentMonday <= c.endDate && sunday >= c.startDate;
      });

      activeCourses.forEach(item => {
        let shift = "sang";
        const startLesson = parseInt(item.session.split("-")[0]);
        if (startLesson >= 6 && startLesson <= 10) shift = "chieu";
        else if (startLesson > 10) shift = "toi";

        const targetCell = document.getElementById(`cell-${item.dayOfWeek}-${shift}`);
        if (!targetCell) return;

        let styleBadge = "bg-slate-100 border-slate-300 text-slate-800";
        if (item.subject.toLowerCase().includes("tin học")) {
          styleBadge = "bg-emerald-100 border-emerald-400 text-emerald-900";
        } else if (item.room.toLowerCase().includes("online")) {
          styleBadge = "bg-sky-100 border-sky-400 text-sky-900";
        }

        const tag = document.createElement("div");
        tag.className = `p-2 rounded-lg border text-left shadow-sm transition hover:shadow ${styleBadge}`;
        tag.innerHTML = `
          <div class="font-bold leading-tight text-xs mb-1 text-slate-900">${item.subject}</div>
          <div class="text-[10px] opacity-75 font-mono mb-1">${item.classCode}</div>
          <div class="text-[11px] space-y-0.5 opacity-90">
            <div><strong>Tiết:</strong> ${item.session}</div>
            <div><strong>Phòng:</strong> ${item.room}</div>
            <div><strong>GV:</strong> ${item.teacher}</div>
          </div>
        `;
        targetCell.appendChild(tag);
      });
    }

    function prevWeek() {
      if (!currentMonday) return;
      currentMonday.setDate(currentMonday.getDate() - 7);
      renderWeek();
    }

    function nextWeek() {
      if (!currentMonday) return;
      currentMonday.setDate(currentMonday.getDate() + 7);
      renderWeek();
    }

    function currentWeek() {
      if (!semesterStartMonday) return;
      currentMonday = new Date(semesterStartMonday);
      renderWeek();
    }

    function exportICS() {
      if (allCourses.length === 0) return;

      let icsContent = [
        "BEGIN:VCALENDAR",
        "VERSION:2.0",
        "PRODID:-//HCalendar//VN",
        "CALSCALE:GREGORIAN",
        "METHOD:PUBLISH"
      ];

      const dayMap = { "2": "MO", "3": "TU", "4": "WE", "5": "TH", "6": "FR", "7": "SA", "CN": "SU" };

      allCourses.forEach((ev, i) => {
        const time = LESSON_HOURS[ev.session] || { start: "07:00", end: "11:30" };
        const dayOffset = ev.dayOfWeek === "CN" ? 6 : parseInt(ev.dayOfWeek) - 2;
        
        let firstClassDate = new Date(ev.startDate);
        const targetDay = ev.dayOfWeek === "CN" ? 0 : parseInt(ev.dayOfWeek) - 1;
        while (firstClassDate.getDay() !== targetDay) {
          firstClassDate.setDate(firstClassDate.getDate() + 1);
        }

        const formatICSDate = (d, timeStr) => {
          const y = d.getFullYear();
          const m = String(d.getMonth() + 1).padStart(2, "0");
          const day = String(d.getDate()).padStart(2, "0");
          const [hh, mm] = timeStr.split(":");
          return `${y}${m}${day}T${hh}${mm}00`;
        };

        const dtStart = formatICSDate(firstClassDate, time.start);
        const dtEnd = formatICSDate(firstClassDate, time.end);
        const untilDate = `${ev.endDate.getFullYear()}${String(ev.endDate.getMonth() + 1).padStart(2, "0")}${String(ev.endDate.getDate()).padStart(2, "0")}T235959Z`;

        icsContent.push(
          "BEGIN:VEVENT",
          `UID:${Date.now()}_${i}@hcalendar.local`,
          `DTSTAMP:${formatICSDate(new Date(), "00:00")}Z`,
          `SUMMARY:${ev.subject}`,
          `LOCATION:${ev.room}`,
          `DESCRIPTION:Lớp: ${ev.classCode}\\nTiết: ${ev.session}\\nPhòng: ${ev.room}\\nGV: ${ev.teacher}`,
          `DTSTART:${dtStart}`,
          `DTEND:${dtEnd}`,
          `RRULE:FREQ=WEEKLY;UNTIL=${untilDate};BYDAY=${dayMap[ev.dayOfWeek] || 'MO'}`,
          "END:VEVENT"
        );
      });

      icsContent.push("END:VCALENDAR");

      const blob = new Blob([icsContent.join("\r\n")], { type: "text/calendar;charset=utf-8" });
      const link = document.createElement("a");
      link.href = window.URL.createObjectURL(blob);
      link.setAttribute("download", "ThoiKhoaBieu_HocKy.ics");
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }
  </script>
</body>
</html>
